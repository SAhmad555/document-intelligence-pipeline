<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Intelligence</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1d2433; --muted: #667085; --line: #e4e7ec;
    --accent: #3b5bdb; --ok: #2b8a3e; --warn: #e67700; --bad: #c92a2a; --okbg: #ebfbee; --warnbg: #fff4e6; --badbg: #fff5f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  .stats { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
  .stat b { display: block; font-size: 18px; }
  .stat span { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .drop { margin: 12px; padding: 18px; border: 2px dashed var(--line); border-radius: 8px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); background: #edf2ff; }
  .tabs { display: flex; gap: 4px; padding: 0 12px; flex-wrap: wrap; }
  .tabs button { border: 0; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font: inherit; }
  .tabs button.active { background: #edf2ff; color: var(--accent); font-weight: 600; }
  ul.docs { list-style: none; margin: 8px 0 0; padding: 0; max-height: 65vh; overflow: auto; }
  ul.docs li { padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  ul.docs li:hover, ul.docs li.sel { background: #f2f4f7; }
  ul.docs .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.docs .meta { color: var(--muted); font-size: 12px; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; align-self: start; }
  .AutoApproved, .Approved { background: var(--okbg); color: var(--ok); }
  .NeedsReview { background: var(--warnbg); color: var(--warn); }
  .Rejected, .Failed { background: var(--badbg); color: var(--bad); }
  .detail { padding: 18px 20px; min-width: 0; }
  .detail h2 { margin: 0 0 4px; font-size: 16px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td input { width: 100%; font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  td input.changed { border-color: var(--accent); background: #edf2ff; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); width: 90px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar i { display: block; height: 100%; }
  .conf { white-space: nowrap; font-size: 12px; color: var(--muted); }
  .req::after { content: " *"; color: var(--bad); }
  .box { border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 13px; }
  .box ul { margin: 4px 0 0; padding-left: 18px; }
  .box.warn { background: var(--warnbg); } .box.bad { background: var(--badbg); } .box.ok { background: var(--okbg); }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; color: var(--ink); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); }
  .row { display: flex; gap: 16px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  h3 { font-size: 13px; margin: 18px 0 6px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 8px; display: none; max-width: 420px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Document Intelligence</h1>
    <div class="sub">Invoice extraction &rarr; validation &rarr; human review &middot; extractor: <b id="extractor">&hellip;</b> &middot; <a href="/scalar">API</a></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>documents</span></div>
    <div class="stat"><b id="s-stp">0%</b><span>straight-through</span></div>
    <div class="stat"><b id="s-review">0</b><span>awaiting review</span></div>
    <div class="stat"><b id="s-cost">$0</b><span>model cost</span></div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="drop" id="drop">Drop invoices here or click to upload<br><small>PDF, PNG, JPG or TXT &middot; up to 10 MB</small>
      <input type="file" id="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.md,.eml">
    </div>
    <div class="tabs" id="tabs">
      <button data-s="" class="active">All</button>
      <button data-s="NeedsReview">Needs review</button>
      <button data-s="AutoApproved">Auto-approved</button>
      <button data-s="Approved">Approved</button>
      <button data-s="Failed">Failed</button>
    </div>
    <ul class="docs" id="docs"></ul>
  </section>

  <section class="panel detail" id="detail"><div class="empty">Upload an invoice or pick one from the list.</div></section>
</main>
<div class="toast" id="toast"></div>

<script>
const FIELDS = [
  ['invoiceNumber', 'Invoice number', true], ['invoiceDate', 'Invoice date', true], ['dueDate', 'Due date'],
  ['supplierName', 'Supplier', true], ['supplierVatNumber', 'Supplier VAT no.'], ['customerName', 'Customer'],
  ['currency', 'Currency'], ['subtotal', 'Subtotal'], ['taxAmount', 'Tax'], ['total', 'Total', true],
];
const NUMERIC = new Set(['subtotal', 'taxAmount', 'total']);
let filter = '', selected = null, current = null;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const label = s => s.replace(/([A-Z])/g, ' $1').trim();

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.status === 204 ? null : r.json();
}

async function refresh() {
  const [docs, stats] = await Promise.all([api('/api/documents' + (filter ? '?status=' + filter : '')), api('/api/stats')]);
  $('extractor').textContent = stats.extractor;
  $('s-total').textContent = stats.total;
  $('s-stp').textContent = Math.round(stats.autoApprovalRate * 100) + '%';
  $('s-review').textContent = stats.byStatus.NeedsReview + stats.byStatus.Failed;
  $('s-cost').textContent = '$' + Number(stats.totalCostUsd).toFixed(4);
  $('docs').innerHTML = docs.map(d => `
    <li data-id="${d.id}" class="${d.id === selected ? 'sel' : ''}">
      <span class="name">${esc(d.supplierName || d.fileName)}</span>
      <span class="pill ${d.status}">${label(d.status)}</span>
      <span class="meta">${esc(d.fileName)} &middot; ${d.total != null ? esc(d.currency || '') + ' ' + Number(d.total).toFixed(2) : 'no total'}</span>
      <span class="meta">${d.reviewReasonCount ? d.reviewReasonCount + ' flag' + (d.reviewReasonCount > 1 ? 's' : '') : ''}</span>
    </li>`).join('') || '<li class="meta">No documents yet.</li>';
}

function confBar(c) {
  if (c == null) return '';
  const color = c >= 0.85 ? 'var(--ok)' : c >= 0.6 ? 'var(--warn)' : 'var(--bad)';
  return `<span class="conf"><span class="bar"><i style="width:${c * 100}%;background:${color}"></i></span> ${c.toFixed(2)}</span>`;
}

async function show(id) {
  selected = id;
  current = await api('/api/documents/' + id);
  const d = current, data = d.corrected || d.data || {}, conf = d.confidence || {};
  const editable = d.status === 'NeedsReview' || d.status === 'AutoApproved' || d.status === 'Failed';
  const errors = d.issues.filter(i => i.severity === 'Error'), warnings = d.issues.filter(i => i.severity === 'Warning');

  $('detail').innerHTML = `
    <h2>${esc(d.fileName)} <span class="pill ${d.status}">${label(d.status)}</span></h2>
    <div class="row">
      <span>${esc(d.extractor)}${d.model ? ' &middot; ' + esc(d.model) : ''}</span>
      <span>${d.durationMs} ms</span>
      ${d.inputTokens != null ? `<span>${d.inputTokens} in / ${d.outputTokens} out tokens &middot; $${Number(d.costUsd).toFixed(5)}</span>` : ''}
      <a href="/api/documents/${d.id}/file" target="_blank">original</a>
    </div>
    ${d.error ? `<div class="box bad"><b>Extraction failed:</b> ${esc(d.error)}</div>` : ''}
    ${d.reviewReasons.length && d.status === 'NeedsReview' ? `<div class="box warn"><b>Why this needs review</b><ul>${d.reviewReasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    ${d.status === 'AutoApproved' ? '<div class="box ok">Passed every validation rule and confidence threshold - posted without review.</div>' : ''}
    ${d.correctedFields.length ? `<div class="box ok">Reviewer corrected: ${d.correctedFields.map(esc).join(', ')}</div>` : ''}
    <table>
      <tr><th>Field</th><th>Value</th><th>Confidence</th></tr>
      ${FIELDS.map(([k, name, req]) => `
        <tr><td class="${req ? 'req' : ''}">${name}</td>
          <td><input data-f="${k}" value="${esc(data[k])}" ${editable ? '' : 'disabled'} placeholder="(not found)"></td>
          <td>${confBar(conf[k])}</td></tr>`).join('')}
    </table>
    <h3>Line items ${confBar(conf.lineItems)}</h3>
    <table>
      <tr><th>Description</th><th>Qty</th><th>Unit</th><th>Amount</th></tr>
      ${(data.lineItems || []).map(l => `<tr><td>${esc(l.description)}</td><td>${l.quantity ?? ''}</td><td>${l.unitPrice ?? ''}</td><td>${l.amount ?? ''}</td></tr>`).join('') || '<tr><td colspan="4" class="meta">No line items found.</td></tr>'}
    </table>
    ${errors.length ? `<div class="box bad"><b>Validation errors</b><ul>${errors.map(i => `<li><code>${i.code}</code> ${esc(i.message)}</li>`).join('')}</ul></div>` : ''}
    ${warnings.length ? `<div class="box warn"><b>Warnings</b><ul>${warnings.map(i => `<li><code>${i.code}</code> ${esc(i.message)}</li>`).join('')}</ul></div>` : ''}
    ${editable ? `<div class="actions">
      <button class="btn primary" id="approve">Approve${d.status === 'AutoApproved' ? ' (confirm)' : ''}</button>
      <button class="btn danger" id="reject">Reject</button></div>` : ''}
    ${d.reviewedBy ? `<p class="row">Reviewed by ${esc(d.reviewedBy)} at ${new Date(d.reviewedAtUtc).toLocaleString()}</p>` : ''}`;

  document.querySelectorAll('#detail input[data-f]').forEach(inp =>
    inp.addEventListener('input', () => inp.classList.toggle('changed', inp.value !== String(data[inp.dataset.f] ?? ''))));
  $('approve')?.addEventListener('click', approve);
  $('reject')?.addEventListener('click', reject);
  refresh();
}

async function approve() {
  const base = current.data || {}, out = { ...base, lineItems: base.lineItems || [] };
  document.querySelectorAll('#detail input[data-f]').forEach(inp => {
    const v = inp.value.trim(), k = inp.dataset.f;
    out[k] = v === '' ? null : NUMERIC.has(k) ? Number(v.replace(/,/g, '')) : v;
  });
  try {
    await api(`/api/documents/${current.id}/review`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: out, reviewer: 'demo-user' }) });
    toast('Approved'); show(current.id);
  } catch (e) { toast('Approve failed: ' + e.message); }
}

async function reject() {
  const reason = prompt('Reason for rejecting this document?');
  if (!reason) return;
  await api(`/api/documents/${current.id}/reject`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason, reviewer: 'demo-user' }) });
  toast('Rejected'); show(current.id);
}

async function upload(files) {
  for (const f of files) {
    const body = new FormData(); body.append('file', f);
    toast('Processing ' + f.name + '...');
    try { const d = await api('/api/documents', { method: 'POST', body }); await show(d.id); }
    catch (e) { toast(f.name + ': ' + e.message); }
  }
  refresh();
}

const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => upload(e.target.files));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); upload(e.dataTransfer.files); });
$('docs').addEventListener('click', e => { const li = e.target.closest('li[data-id]'); if (li) show(li.dataset.id); });
$('tabs').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === e.target));
  filter = e.target.dataset.s; refresh();
});
refresh();
</script>
</body>
</html>
